<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Лондонский кит — квиз</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#071a2b; --bg2:#0c2740; --ink:#eaf4ff; --mute:#8fb0cc; --line:rgba(234,244,255,.12);
    --acc:#5ad1ff; --ok:#3ee08f; --bad:#ff6b6b; --card:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 70% at 50% -10%,#123b5e 0%,var(--bg) 60%) fixed, var(--bg);
    min-height:100%; overflow-x:hidden;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .bar{height:4px;background:var(--line);border-radius:4px;margin:12px 0 22px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#a6ecff);border-radius:4px;transition:width .4s ease}
  h1{font-size:34px;line-height:1.05;margin:8px 0 14px;letter-spacing:-.02em}
  h2{font-size:21px;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em;font-weight:650}
  p{margin:0 0 12px;line-height:1.45}
  .mute{color:var(--mute)}
  .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    text-align:left;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 46px;position:relative;cursor:pointer;
    transition:transform .12s ease,background .2s,border-color .2s;
  }
  .opt:active{transform:scale(.985)}
  .opt b{position:absolute;left:14px;top:13px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--mute);font-weight:600}
  .opt.ok{background:rgba(62,224,143,.14);border-color:var(--ok)}
  .opt.ok b{background:var(--ok);border-color:var(--ok);color:#06210f}
  .opt.bad{background:rgba(255,107,107,.13);border-color:var(--bad)}
  .opt.bad b{background:var(--bad);border-color:var(--bad);color:#2a0606}
  .opt.dim{opacity:.45}
  .opt[disabled]{cursor:default}
  .exp{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(90,209,255,.08);border:1px solid rgba(90,209,255,.25);font-size:15px;line-height:1.45;animation:in .3s ease}
  .exp strong{display:block;margin-bottom:4px}
  .btn{
    margin-top:auto;font:inherit;font-weight:650;font-size:17px;color:#04213a;background:var(--acc);border:0;border-radius:14px;padding:16px;width:100%;cursor:pointer
  }
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .spacer{flex:1;min-height:18px}
  .whale{width:100%;max-width:320px;margin:10px auto 6px;display:block;animation:float 5s ease-in-out infinite}
  .score{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 4px}
  .score small{font-size:28px;color:var(--mute);font-weight:600}
  .verdict{font-size:22px;line-height:1.3;font-weight:650;margin:14px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
  .chip{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700}
  .chip.y{background:rgba(62,224,143,.2);color:var(--ok)}
  .chip.n{background:rgba(255,107,107,.18);color:var(--bad)}
  .src{font-size:12px;color:var(--mute);margin-top:18px;line-height:1.4}
  .fade{animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
try{ tg.ready(); tg.expand(); tg.setHeaderColor('#071a2b'); tg.setBackgroundColor('#071a2b'); }catch(e){}
const haptic = t => { try{ t==='ok'||t==='bad' ? tg.HapticFeedback.notificationOccurred(t==='ok'?'success':'error') : tg.HapticFeedback.impactOccurred('light'); }catch(e){} };

const Q = [
 {q:"Декабрь 2011. Руководство JPMorgan ставит CIO задачу по портфелю SCP. В чём была ловушка?",
  o:["Сократить риск (снизить RWA перед Basel III) и при этом не понести издержек на сокращение",
     "Довести доходность портфеля до уровня трейдинга инвестбанка",
     "Закрыть все позиции по CDS за месяц по требованию регулятора",
     "Перевести портфель из Лондона в Нью-Йорк, не останавливая торговлю"],a:0,
  e:"Быстро сократить риск = продать позиции с убытком. Сократить риск без издержек и без потери дохода от риска невозможно. Отсюда и всё, что было дальше."},
 {q:"Конец января 2012: CIO покупает защиту на high yield и оплачивает её, продавая защиту на investment grade. Какая у банка позиция по кредитному риску IG?",
  o:["Короткая — банк застраховался от дефолтов IG",
     "Длинная — продавая защиту, банк сам берёт на себя риск IG",
     "Нейтральная — покупка и продажа гасят друг друга",
     "Никакой — по IG у банка только процентный риск"],a:1,
  e:"Продавец защиты — это страховщик: он получает премии, но сам несёт кредитный риск. HY: покупка → короткая позиция, платим. IG: продажа → длинная позиция, получаем."},
 {q:"В начале 2012 спреды и HY, и IG сужались, но HY — быстрее. Что это значило для связки «купили защиту на HY / продали на IG»?",
  o:["Обе ноги в плюсе — рынок успокаивался",
     "Купленная защита на HY теряла больше, чем приносила проданная на IG",
     "Проданная защита на IG теряла, а купленная на HY зарабатывала",
     "Ничего: при сужении спредов CDS не переоцениваются"],a:1,
  e:"Сузился спред — страховка подешевела. Купленная защита на HY дешевела быстрее, чем зарабатывала проданная на IG. Хедж начал работать против банка."},
 {q:"Ни одна компания из индекса не обанкротилась, а портфель SCP всё равно терял деньги. Как так?",
  o:["Банк ежедневно платил штрафы регуляторам",
     "Контрагенты перестали платить премии по CDS",
     "После 23 марта спреды IG9 выросли, и проданная защита подешевела при переоценке",
     "Убытка не было — это ошибка в расчёте VaR"],a:2,
  e:"CDS переоцениваются по рынку. Спред растёт — продавец защиты в минусе ещё до любого дефолта. Убытки возникали без единого банкротства."},
 {q:"Конец февраля 2012: на JPMorgan приходится больше 90% чистого объёма торгов IG9 10Y, чистая позиция — $65 млрд. Почему нельзя было просто тихо закрыть позицию?",
  o:["Закрытие позиций запрещал Basel III",
     "Контракты CDS нельзя закрыть до погашения",
     "Позицию закрыли, но трейдеры это скрыли",
     "Кит и есть рынок: выкупая защиту, банк сам двигает спреды против себя"],a:3,
  e:"Ловушка ликвидности. Закрытие → выкуп защиты → рост спредов → новые потери. Чем больше позиция, тем дороже выход."},
 {q:"CIO вводит новую модель VaR, и показатель падает со $132 млн до $66 млн. Что на самом деле произошло с риском?",
  o:["Риск сократился вдвое благодаря хеджированию",
     "Риск остался прежним: изменился способ его считать, плюс ошибки в волатильностях и корреляциях",
     "Регулятор сам потребовал снизить VaR вдвое",
     "VaR упал, потому что позицию к тому моменту уже закрыли"],a:1,
  e:"Старую модель назвали «слишком консервативной», новая занизила риск в два раза. Модельный риск в чистом виде: градусник сломали, а температура осталась."},
 {q:"Какой лимит был нарушен раньше всех, то есть когда кит впервые подал сигнал?",
  o:["Стресс-лимит CSW10% — 22 марта",
     "Чувствительность к спреду CSBPV — 6 января",
     "Лимит потерь по стресс-тестам — 29 марта",
     "Стоп-лосс лимиты ($60–70 млн) — ещё в декабре 2011"],a:3,
  e:"Стоп-лоссы были превышены уже в декабре 2011, CSBPV — 6 января, CRM вырос с $2 до ≈$6,3 млрд к 22 февраля. Торговлю SCP приостановили только 22 марта."},
 {q:"Бывший глава рыночного риска CIO заявил, что следить за лимитами — «не его задача». Какая линия защиты провалилась?",
  o:["Первая — бизнес-подразделения",
     "Вторая — риск-менеджмент и контроль",
     "Третья — внутренний аудит",
     "Никакая — это была зона ответственности регулятора"],a:1,
  e:"Вторая линия. Там же: риск-менеджеры не участвовали в согласовании стратегии, а CRO банка сменился в январе 2012."},
 {q:"Нарушения лимитов и рост позиции были видны во внутренних отчётах. Куда это попадает в матрице известного и неизвестного?",
  o:["Unknown unknowns — чёрный лебедь",
     "Known unknowns",
     "Known knowns",
     "Unknown knowns"],a:2,
  e:"Known knowns: факты были на руках. Это не чёрный лебедь. Неизвестный исход ≠ неизвестный риск: кит был на радаре, но тревога не стала действием."},
 {q:"Торговый убыток SCP за 2012 год — $6,2 млрд. Штрафы пяти регуляторов в 2013 году — ≈$1,02 млрд. Какую долю убытка составили штрафы?",
  o:["≈ 6%","≈ 16%","≈ 33%","≈ 60%"],a:1,
  e:"≈$920 млн (SEC, OCC, ФРС, FCA) + $100 млн (CFTC) ≈ 16% убытка. А дело двух трейдеров в 2017 году прекратили без приговора. Это не оправдание: были проблемы с экстрадицией и показаниями."}
];

const R = [
 {min:0, max:3, t:"ты и есть кит. VaR занижен, лимиты пробиты, но держишься уверенно 🐋"},
 {min:4, max:6, t:"вторая линия защиты: что-то заметил, но промолчал 👀"},
 {min:7, max:8, t:"риск-менеджер, которого JPM не послушал. обидно 📉"},
 {min:9, max:10,t:"кайф, молодец. тебя бы в CIO в 2011-м — и 6,2 млрд остались бы в банке 💸"}
];

const WHALE = `<svg class="whale" viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fdcff"/><stop offset="1" stop-color="#2b7bb5"/></linearGradient></defs>
 <path d="M40 98c0-34 38-58 92-58 52 0 92 22 108 50 8-10 22-24 40-28-6 14-8 26-6 36 14 2 22 10 26 18-20-6-38-4-54 4-14 30-56 46-110 46C74 166 40 136 40 98z" fill="url(#g)"/>
 <path d="M58 116c22 18 56 26 96 24 32-2 58-10 74-24" stroke="#e8f8ff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
 <circle cx="86" cy="96" r="5" fill="#071a2b"/>
 <path d="M150 40c-4-14 0-26 6-32M150 40c-10-8-22-10-30-8M150 40c8-10 20-14 30-12" stroke="#a6ecff" stroke-width="4" fill="none" stroke-linecap="round"/>
 <text x="196" y="112" font-family="-apple-system,Helvetica,Arial" font-weight="800" font-size="22" fill="#071a2b" opacity=".55">$</text>
</svg>`;

let i=0, score=0, hist=[];
const app=document.getElementById('app');
const L="ABCD";
const shuffle=a=>{const r=a.slice();for(let k=r.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[r[k],r[j]]=[r[j],r[k]]}return r};

function start(){
  i=0;score=0;hist=[];
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="top"><span>Мировая экономика · 2026</span><span>JPMorgan</span></div>
    <div class="spacer"></div>
    ${WHALE}
    <div class="kicker">квиз · 10 вопросов</div>
    <h1>Лондонский кит</h1>
    <p class="mute">Как хедж JPMorgan превратился в убыток на $6,2 млрд. Запоминать цифры не обязательно — думай как риск-менеджер.</p>
    <div class="spacer"></div>
    <button class="btn" onclick="ask()">Погнали</button>
  </div>`;
}

function ask(){
  haptic();
  const it=Q[i];
  const order=shuffle([0,1,2,3]);
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="top"><span>Вопрос ${i+1} / ${Q.length}</span><span>${score} ✓</span></div>
    <div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div>
    <h2>${it.q}</h2>
    <div class="opts">${order.map((k,n)=>`<button class="opt" data-k="${k}"><b>${L[n]}</b>${it.o[k]}</button>`).join('')}</div>
    <div id="exp"></div>
    <div class="spacer"></div>
    <div id="next"></div>
  </div>`;
  requestAnimationFrame(()=>{const b=app.querySelector('.bar i'); if(b) b.style.width=((i)/Q.length*100)+'%';});
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}

function pick(k){
  const it=Q[i], right=k===it.a;
  if(right) score++;
  hist.push(right);
  haptic(right?'ok':'bad');
  app.querySelectorAll('.opt').forEach(b=>{
    const kk=+b.dataset.k; b.disabled=true;
    if(kk===it.a) b.classList.add('ok');
    else if(kk===k) b.classList.add('bad');
    else b.classList.add('dim');
  });
  app.querySelector('.bar i').style.width=((i+1)/Q.length*100)+'%';
  app.querySelector('.top span:last-child').textContent=score+' ✓';
  document.getElementById('exp').innerHTML=`<div class="exp"><strong>${right?'Точно.':'Мимо.'}</strong>${it.e}</div>`;
  document.getElementById('next').innerHTML=`<button class="btn">${i+1<Q.length?'Дальше':'Результат'}</button>`;
  document.querySelector('#next .btn').onclick=()=>{ i++; i<Q.length?ask():result(); };
  document.getElementById('exp').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function result(){
  const r=R.find(x=>score>=x.min&&score<=x.max);
  haptic(score>=7?'ok':'bad');
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="top"><span>Результат</span><span>London Whale</span></div>
    <div class="spacer"></div>
    ${WHALE}
    <div class="score">${score}<small> / ${Q.length}</small></div>
    <div class="verdict">${r.t}</div>
    <div class="chips">${hist.map((h,n)=>`<span class="chip ${h?'y':'n'}">${n+1}</span>`).join('')}</div>
    <div class="spacer"></div>
    <button class="btn" onclick="start()">Пройти ещё раз</button>
    ${tg&&tg.close?'<button class="btn ghost" onclick="try{tg.close()}catch(e){}">Закрыть</button>':''}
    <div class="src">Источники — из презентации: US Senate PSI (2013), Yale Program on Financial Stability (2014–2015), CFTC, FCA, SEC.</div>
  </div>`;
}

start();
</script>
</body>
</html>
